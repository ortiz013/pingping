<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UG Ping Pong Tournament</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    .hero {
      background: linear-gradient(135deg, #1e2a78, #3b46d1);
      color: white;
      padding: 60px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .hero p {
      margin-bottom: 20px;
    }

    .cta {
      display: inline-block;
      padding: 12px 20px;
      background: #5c6cff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .section {
      padding: 40px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      padding: 20px;
      width: 280px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    footer {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="hero">
    <h1>UG Ping Pong Tournament</h1>
    <p>Welcome to the tournament!</p>
    <a class="cta" href="#tournament">View Tournament</a>
  </div>

  <div class="section" id="tournament">

    <div class="card">
      <h2>Tournament</h2>
      <p>View tournament information and upcoming matches.</p>
    </div>

    <div class="card">
      <h2>Players</h2>
      <p>View participating players and tournament standings.</p>
    </div>

    <div class="card">
      <h2>Results</h2>
      <p>Follow match results and tournament progress.</p>
    </div>

  </div>

  <footer>
    UG Ping Pong Tournament
  </footer>

</body>
</html>
